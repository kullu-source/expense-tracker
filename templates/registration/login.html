{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-white rounded-lg shadow-sm p-6">
  <h1 class="text-xl font-semibold mb-4">Login</h1>
  {% if form.errors %}<div class="mb-4 rounded-md bg-red-100 text-red-800 px-4 py-3 text-sm">Wrong username or password.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Username</label>
      <input name="username" autofocus required class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
    </div>
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 rounded-md">Login</button>
  </form>
  <p class="mt-4 text-center text-sm">No account? <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Register</a></p>
</div>
{% endblock %}
