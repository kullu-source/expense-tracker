{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h4 class="mb-3">Login</h4>
    {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" autofocus required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 text-center">No account? <a href="{% url 'register' %}">Register</a></p>
  </div></div>
</div></div>
{% endblock %}
