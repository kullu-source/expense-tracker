{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow-sm p-6">
  <h1 class="text-xl font-semibold mb-4">{{ title }}</h1>
  <form method="post">{% csrf_token %}
    {% include 'form_fields.html' %}
    <div class="flex gap-2">
      <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-md">Save</button>
      <a href="{% url back %}" class="border border-slate-300 hover:bg-slate-50 text-sm px-4 py-2 rounded-md">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
