{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-white rounded-lg shadow-sm p-6">
  <h1 class="text-xl font-semibold mb-4">Create account</h1>
  <form method="post">{% csrf_token %}
    {% include 'form_fields.html' %}
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 rounded-md">Register</button>
  </form>
  <p class="mt-4 text-center text-sm">Already registered? <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Login</a></p>
</div>
{% endblock %}
