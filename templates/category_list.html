{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Categories</h1>
<div class="grid gap-4 md:grid-cols-3">
  <div class="bg-white rounded-lg shadow-sm p-5 h-fit">
    <h2 class="font-semibold mb-3">Add category</h2>
    <form method="post">{% csrf_token %}
      {% include 'form_fields.html' %}
      <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-md">Add</button>
    </form>
  </div>
  <div class="md:col-span-2 bg-white rounded-lg shadow-sm overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-slate-600">
        <tr><th class="px-4 py-3 font-medium">Name</th><th class="px-4 py-3 font-medium">Expenses</th><th></th></tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        {% for c in categories %}
        <tr>
          <td class="px-4 py-3">{{ c.name }}</td>
          <td class="px-4 py-3">{{ c.n }}</td>
          <td class="px-4 py-3 text-right whitespace-nowrap">
            <a href="{% url 'category_update' c.pk %}" class="border border-slate-300 hover:bg-slate-50 text-xs px-3 py-1.5 rounded-md">Edit</a>
            <a href="{% url 'category_delete' c.pk %}" class="border border-red-300 text-red-600 hover:bg-red-50 text-xs px-3 py-1.5 rounded-md">Delete</a>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="px-4 py-6 text-center text-slate-500">No categories yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
