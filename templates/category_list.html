{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<h3 class="mb-3">Categories</h3>
<div class="row g-3">
  <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
    <h5>Add category</h5>
    <form method="post">{% csrf_token %}
      {% include 'form_fields.html' %}
      <button class="btn btn-primary">Add</button>
    </form>
  </div></div></div>
  <div class="col-md-8"><div class="card shadow-sm"><table class="table align-middle mb-0">
    <thead><tr><th>Name</th><th>Expenses</th><th></th></tr></thead>
    {% for c in categories %}
    <tr><td>{{ c.name }}</td><td>{{ c.n }}</td>
      <td class="text-end"><a class="btn btn-sm btn-outline-secondary" href="{% url 'category_update' c.pk %}">Edit</a>
      <a class="btn btn-sm btn-outline-danger" href="{% url 'category_delete' c.pk %}">Delete</a></td></tr>
    {% empty %}<tr><td colspan="3" class="text-muted text-center py-3">No categories yet.</td></tr>{% endfor %}
  </table></div></div>
</div>
{% endblock %}
