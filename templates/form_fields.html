{% if form.non_field_errors %}<div class="mb-4 rounded-md bg-red-100 text-red-800 px-4 py-3 text-sm">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="mb-4">
  <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% for e in field.errors %}<p class="text-red-600 text-xs mt-1">{{ e }}</p>{% endfor %}
  {% if field.help_text %}<div class="text-xs text-slate-500 mt-1">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
